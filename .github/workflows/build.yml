# Builds only on a tag or by hand: the signed binaries are cut from a tagged
# build, never from a branch. (Public repo: hosted runners cost nothing.)
# Signing happens on the control Mac (pasiv: tool/cpu-engine-release.sh) —
# CI never holds the key.
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            exe: pasiv-rx.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: pasiv-rx
          - os: macos-14
            target: aarch64-apple-darwin
            exe: pasiv-rx
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, SHA-pinned
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: no dynamic MSVC runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if grep -aqi 'VCRUNTIME140' target/release/pasiv-rx.exe; then
            echo "pasiv-rx.exe imports VCRUNTIME140 — the static CRT did not apply" >&2; exit 1
          fi
      - name: smoke (bench 30 s, 2 threads)
        shell: bash
        run: ./target/release/${{ matrix.exe }} --bench -t 2 --seconds 30
      - name: package
        shell: bash
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          cp target/release/${{ matrix.exe }} LICENSE THIRD-PARTY-NOTICES.md out/
          cp vendor/RandomX/LICENSE out/LICENSE-RandomX
          {
            echo "pasiv_rx_version=$V"
            echo "commit=$GITHUB_SHA"
            echo "target=${{ matrix.target }}"
            echo "rustc=$(rustc --version)"
            echo "randomx=1.2.1"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > out/BUILD-INFO.txt
          # GPL-3.0: the exact corresponding source travels with every build.
          git archive --format=tar.gz --prefix="pasiv-rx-$V/" -o "out/pasiv-rx-$V-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pasiv-rx-${{ matrix.target }}
          path: out/
