[package]
name = "pasiv-rx"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-only"
description = "Spike: Pasiv's own RandomX CPU miner (tevador/RandomX, BSD-3) with a minimal pool client"

[dependencies]
serde_json = "1"
# TLS to the pool (port 443 fallback). ring, not aws-lc: no NASM/cmake on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"

[build-dependencies]
cmake = "0.1"

[profile.release]
lto = true
codegen-units = 1
